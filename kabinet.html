<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hazar Jalüz - Müştəri Kabineti</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Kabinet Sayfası Ek Stilleri */
    .dashboard-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-md);
      padding: 3rem;
      box-shadow: var(--shadow-md);
      text-align: center;
    }
    .user-avatar-wrapper {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-hover));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: var(--shadow-gold);
      color: var(--text-light);
    }
    .user-avatar-wrapper svg {
      width: 40px;
      height: 40px;
      fill: currentColor;
    }
    .dashboard-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--bg-dark);
      margin-bottom: 0.5rem;
    }
    .dashboard-sub {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }
    .dashboard-info-list {
      max-width: 400px;
      margin: 0 auto 2.5rem;
      text-align: left;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 1.5rem 0;
    }
    .dashboard-info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .dashboard-info-item:last-child {
      margin-bottom: 0;
    }
    .dashboard-info-item strong {
      color: var(--bg-dark);
    }
    .dashboard-info-item span {
      color: var(--text-secondary);
    }
    .badge-role {
      background: var(--accent-gold-light);
      color: var(--accent-gold);
      padding: 0.2rem 0.6rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Header / Naviqasiya -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo-link">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M19 19H5V5h14v14zM5 3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5zm12 6H7v2h10V9zm0 4H7v2h10v-2zm0 4H7v2h10v-2zm0-12H7v2h10V5z"/>
          </svg>
        </div>
        <span class="logo-text">HAZAR<span>JALÜZ</span></span>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Məhsullar</a></li>
          <li><a href="index.html#hakkimizda">Haqqımızda</a></li>
          <li><a href="index.html#iletisim">Əlaqə</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Ana Kapsayıcı -->
  <div class="auth-container" id="kabinet-content">
    <div style="text-align: center; padding: 3rem;">
      <p style="color: var(--text-secondary);">Kabinet yüklənir...</p>
    </div>
  </div>

  <!-- Toast Bildirim Kabı -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Supabase & JS Scriptleri -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="kabinet.js"></script>
</body>
</html>
